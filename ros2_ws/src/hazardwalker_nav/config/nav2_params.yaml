# Nav2 导航栈参数 —— HazardWalker 官方 SimEnv
#
# 所属组：导航组。
# 使用场景：
#   - 诊断模式：ros2 launch hazardwalker_nav nav2_bringup.launch.py
#   - 与 frontier 探索互补：frontier 负责决策“去哪”，Nav2 负责“怎么走”
#   - 手动导航：通过 RVIZ "2D Goal Pose" 发送目标点
#
# 坐标系：map → odom → base（base 帧由合法 scan/IMU 里程计发布）
# SLAM Toolbox 提供 /map 和 map→odom TF；本文件不启动 AMCL。
#
# 前置条件：
#   - SLAM Toolbox 已运行并发布 /map
#   - scan_imu_localizer_node 已运行并发布 odom→base TF
#   - /hw/scan、/hw/cmd_vel 可用

amcl:
  ros__parameters:
    use_sim_time: true
    # AMCL 不启动：SLAM Toolbox 在 mapping 模式下直接提供 map→odom TF。
    # 若将来切换到纯定位模式，取消下面的注释并设置 robot_model_type 等参数。

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base
    odom_topic: /hazardwalker/slam/odometry
    bt_loop_duration: 100
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 标准 Nav2 行为树（含恢复动作）
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    # 插件列表
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
    # 错误处理
    transform_tolerance: 0.5
    global_frame: map
    robot_base_frame: base

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    # 四足机器人名义最小线速度，避免 DWB 输出 0.02 m/s 的无效指令
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05
    # 失败检测：丢失进度超过阈值时触发恢复行为
    failure_tolerance: 0.8
    progress_checker_required_poses_to_skip: 5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins:
      - "general_goal_checker"
    controller_plugins:
      - "FollowPath"
    # 主控制器：DWB（动态窗口方法），适配差速/全向平台
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.35
      max_vel_y: 0.0          # A1 可通过 /hw/cmd_vel linear.y 实现横移，但 Nav2
                               # 默认差速模型更稳定；复查横移由 frontier_explorer 直控
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      # 加速度限制（A1 控制器较轻量，不宜过猛）
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      # 速度采样数
      vx_samples: 16
      vy_samples: 0           # 差速模型不采样横向
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      # 前向偏好：大幅惩罚倒车，四足前进效率远高于后退
      penalize_negative_x: true
      # 轨迹评分权重
      path_distance_bias: 32.0
      goal_distance_bias: 24.0
      occdist_scale: 0.04
      forward_preference: 0.05
      # 对齐：让机器人朝向路径末端姿态
      use_dwa: false
      # 评价器插件
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "GoalDist"
        - "PathDist"
        - "GoalAlign"
        - "PreferForward"
        - "ObstacleFootprint"
      ObstacleFootprint.scale: 1.0
      ObstacleFootprint.max_scaling_factor: 0.2
      ObstacleFootprint.scaling_speed: 0.25
      RotateToGoal.scale: 1.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.scale: 1.5
      GoalDist.scale: 0.6
      PathDist.scale: 32.0
      GoalAlign.scale: 0.8
      PreferForward.scale: 0.1
    # 进度检查器
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 8.0
    # 目标检查器
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins:
      - "GridBased"
    # 全局规划器：Smac Hybrid-A*（支持非圆形footprint，适合四足平台）
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false           # 安全策略：禁止穿越未知区域
      max_iterations: 150000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72    # 5° 分辨率
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smooth_path: true
      minimum_turning_radius: 0.30
      reverse_penalty: 2.5
      change_penalty: 0.15
      non_straight_penalty: 1.3
      cost_penalty: 2.5
      retrospective_penalty: 0.05
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      debug_visualizations: false
      # A1 约 0.6m × 0.4m 外接矩形；稍大的半径保证安全
      robot_radius: 0.45
      # 代价地图参数
      costmap_downsampling_factor: 1
      costmap_min_obstacle_height: 0.0
      costmap_max_obstacle_height: 2.0
      # 排除/包含区域由 global_costmap 统一管理

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base
      # 直接使用 SLAM 地图作为静态层；不再开单独的 map_server
      rolling_window: false
      width: 200           # 200 × 0.05 m = 100 m 边长
      height: 200
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      robot_radius: 0.45
      footprint: "[]"      # 空字符串优先；若设置 robot_radius 则自动圆形膨胀
      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        enabled: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /hw/scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          obstacle_max_range: 8.0
          obstacle_min_range: 0.4
          raytrace_max_range: 8.5
          raytrace_min_range: 0.4
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base
      rolling_window: true
      width: 5             # 5 × 0.05 m = 2.5 m 局部窗口
      height: 5
      resolution: 0.05
      robot_radius: 0.45
      footprint: "[]"
      always_send_full_costmap: true
      plugins:
        - "obstacle_layer"
        - "inflation_layer"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /hw/scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          obstacle_max_range: 8.0
          obstacle_min_range: 0.4
          raytrace_max_range: 8.5
          raytrace_min_range: 0.4
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

map_server:
  ros__parameters:
    use_sim_time: true
    # SLAM Toolbox 直接发布 /map；不需要 map_server 从磁盘加载地图。
    # 该节点在诊断 / 纯定位场景下可单独加载离线地图。

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: /local_costmap/costmap_raw
    global_costmap_topic: /global_costmap/costmap_raw
    local_footprint_topic: /local_costmap/published_footprint
    global_footprint_topic: /global_costmap/published_footprint
    footprint: "[]"
    robot_radius: 0.45
    cycle_frequency: 10.0
    # 恢复行为插件
    behavior_plugins:
      - "spin"
      - "backup"
      - "wait"
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    # 全局帧与机器人帧
    global_frame: map
    robot_base_frame: base
    transform_tolerance: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0.5

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    max_velocity: [0.35, 0.0, 1.5]        # [vx, vy, vtheta]
    min_velocity: [-0.15, 0.0, -1.5]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.8, 0.0, -1.5]
    odom_topic: /hazardwalker/slam/odometry
    odom_duration: 1.0
    deadband_velocity: [0.02, 0.0, 0.02]
    velocity_timeout: 1.0

# 系统级 TF 参数
# Nav2 查找变换时需要的缓冲/超时（秒）
global_frame: map
odom_frame: odom
robot_base_frame: base
transform_timeout: 0.5
