# ROS 1 Noetic in Ubuntu 20.04 container (Gazebo Classic + unitree_guide).
# Host: Ubuntu 24.04 — run via ./auto_docker.sh from SimEnv_ROS1 root.
#
# Per-user container name avoids clashes when multiple hazard_* accounts run sim.

services:
  simenv_noetic:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: simenv_ros1:noetic-focal
    container_name: simenv_ros1_${DOCKER_SIMENV_USER:-default}
    network_mode: host
    # gzserver 曾在长时间仿真中持续膨胀并触发宿主机全局 OOM。正式容器默认将
    # 内存和内存+交换区同时限制为 32 GiB；达到上限时只结束本容器，不自动
    # 重启泄漏进程。平台管理员可按主机容量显式覆盖，但不得取消上限。
    mem_limit: ${SIMENV_MEMORY_LIMIT:-32g}
    memswap_limit: ${SIMENV_MEMORY_SWAP_LIMIT:-32g}
    working_dir: /home/ros/simenv_ws
    volumes:
      # Compose 文件位于 docker/；默认必须挂载其父目录（完整 SimEnv 工作区），
      # 否则容器虽显示 Running，实际入口脚本均不存在。
      - ${SIMENV_HOST_PATH:-..}:/home/ros/simenv_ws
    environment:
      ROS_DISTRO: noetic
      DOCKER_SIMENV_USER: ${DOCKER_SIMENV_USER:-default}
      LIBTORCH_ROOT: /home/ros/Guoyulun/Download/libtorch
      LD_LIBRARY_PATH: /home/ros/Guoyulun/Download/libtorch/lib
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      GUI: ${GUI:-false}
      # 正式链路由 auto.sh 统一启动：先拉起控制器并确认 RL，再解除物理暂停。
      PAUSED: ${PAUSED:-true}
      SEED: ${SEED:-}
      FLOOR_COUNT: ${FLOOR_COUNT:-3}
      ROOMS_PER_FLOOR: ${ROOMS_PER_FLOOR:-4}
      DANGER_COUNT: ${DANGER_COUNT:-3:6}
      DISTRACTOR_COUNT: ${DISTRACTOR_COUNT:-4:8}
      ROBOT_X: ${ROBOT_X:-0}
      ROBOT_Y: ${ROBOT_Y:--2.2}
      ROBOT_Z: ${ROBOT_Z:-0.6}
      ROBOT_YAW: ${ROBOT_YAW:-1.5708}
      START_CONTROLLER: ${START_CONTROLLER:-1}
      SIMENV_AUTO_RL: ${SIMENV_AUTO_RL:-1}
      SIMENV_HEADLESS_MODE: ${SIMENV_HEADLESS_MODE:-move_base}
      SIMENV_RECOVERY_REQUEST_FILE: ${SIMENV_RECOVERY_REQUEST_FILE:-/tmp/hazardwalker-controller-recover.request}
      # 运动探针会改变机器人初始位置，默认关闭；正式验收可显式开启并由
      # auto.sh 按真实 Gazebo 位移和机体高度 fail-closed。
      VERIFY_CONTROLLER_MOTION: ${VERIFY_CONTROLLER_MOTION:-0}
      # 留空时由 auto.sh 继承 VERIFY_CONTROLLER_MOTION。此前默认写死为 0，
      # 会覆盖入口脚本的继承逻辑，导致显式开启运动验收后仍停在 fixed stand。
      CONTROLLER_DYNAMIC_RL_STARTUP: ${CONTROLLER_DYNAMIC_RL_STARTUP:-}
      CONTROLLER_STAND_SETTLE_SEC: ${CONTROLLER_STAND_SETTLE_SEC:-6.0}
      ENABLE_LIDAR: ${ENABLE_LIDAR:-false}
      ENABLE_LIVOX_3D: ${ENABLE_LIVOX_3D:-false}
      CAMERA_IMAGER_RATE_HZ: ${CAMERA_IMAGER_RATE_HZ:-10}
      CAMERA_JPEG_QUALITY: ${CAMERA_JPEG_QUALITY:-92}
      START_ROSBRIDGE: ${START_ROSBRIDGE:-1}
      ROSBRIDGE_PORT: ${ROSBRIDGE_PORT:-9090}
      START_ODOM_RELAY: ${START_ODOM_RELAY:-1}
      START_BUILDING_CONTROL: ${START_BUILDING_CONTROL:-1}
      START_UNITREE_MOVE_BASE: ${START_UNITREE_MOVE_BASE:-0}
      START_VIRTUAL_JOY: ${START_VIRTUAL_JOY:-0}
      CONTROLLER_FOREGROUND: ${CONTROLLER_FOREGROUND:-0}
      UNITREE_CTRL_DT: ${UNITREE_CTRL_DT:-0.004}
      # 当前主机驱动与 LibTorch cu118 的 cublas 在 RL 首帧存在段错误；
      # 默认仅将控制策略放在 CPU，Gazebo/VirtualGL 仍可继续使用 GPU。
      UNITREE_RL_FORCE_CPU: ${UNITREE_RL_FORCE_CPU:-1}
    command: >
      bash -lc "
        test -x ./auto.sh ||
          { echo 'ERROR: missing executable ./auto.sh'; exit 1; }
        exec ./auto.sh
      "
    # 健康检查只报告状态，不重启或切换控制器。除控制器和 rosbridge 外，必须
    # 确认 gzserver 本体仍存活；否则子进程被 cgroup OOM 杀死后，残留 ROS Master
    # 和旧 ready 文件会把已经停止仿真的容器误报为 healthy。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/noetic/setup.bash &&
          test -f /tmp/hazardwalker-simenv-runtime-ready &&
          pgrep -x gzserver >/dev/null &&
          { [ "$${START_CONTROLLER:-1}" != "1" ] ||
          { pgrep -x junior_ctrl >/dev/null &&
          rostopic info /cmd_vel 2>/dev/null |
          grep -Eq "^[[:space:]]*\*[[:space:]]+/unitree_gazebo_servo[[:space:]]"; }; } &&
          { [ "$${START_ROSBRIDGE:-1}" != "1" ] ||
          rosnode ping -c 1 /rosbridge_websocket >/dev/null 2>&1; } &&
          { [ "$${START_UNITREE_MOVE_BASE:-0}" != "1" ] ||
          { pgrep -x move_base >/dev/null &&
          rosnode ping -c 1 /move_base >/dev/null 2>&1; }; }'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: "${SIMENV_RESTART_POLICY:-no}"
