# ROS 1 Noetic in Ubuntu 20.04 container (Gazebo Classic + unitree_guide).
# Host: Ubuntu 24.04 — run via ./auto_docker.sh from SimEnv_ROS1 root.
#
# Per-user container name avoids clashes when multiple hazard_* accounts run sim.

services:
  simenv_noetic:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: simenv_ros1:noetic-focal
    container_name: simenv_ros1_${DOCKER_SIMENV_USER:-default}
    network_mode: host
    working_dir: /home/ros/simenv_ws
    volumes:
      # Compose 文件位于 docker/；默认必须挂载其父目录（完整 SimEnv 工作区），
      # 否则容器虽显示 Running，实际入口脚本均不存在。
      - ${SIMENV_HOST_PATH:-..}:/home/ros/simenv_ws
    environment:
      ROS_DISTRO: noetic
      DOCKER_SIMENV_USER: ${DOCKER_SIMENV_USER:-default}
      LIBTORCH_ROOT: /home/ros/Guoyulun/Download/libtorch
      LD_LIBRARY_PATH: /home/ros/Guoyulun/Download/libtorch/lib
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      GUI: ${GUI:-false}
      # 正式链路由 auto.sh 统一启动：先拉起控制器并确认 RL，再解除物理暂停。
      PAUSED: ${PAUSED:-true}
      SEED: ${SEED:-}
      FLOOR_COUNT: ${FLOOR_COUNT:-3}
      ROOMS_PER_FLOOR: ${ROOMS_PER_FLOOR:-4}
      DANGER_COUNT: ${DANGER_COUNT:-3:6}
      DISTRACTOR_COUNT: ${DISTRACTOR_COUNT:-4:8}
      ROBOT_X: ${ROBOT_X:-0}
      ROBOT_Y: ${ROBOT_Y:--2.2}
      ROBOT_Z: ${ROBOT_Z:-0.6}
      ROBOT_YAW: ${ROBOT_YAW:-1.5708}
      START_CONTROLLER: ${START_CONTROLLER:-1}
      SIMENV_AUTO_RL: ${SIMENV_AUTO_RL:-1}
      SIMENV_HEADLESS_MODE: ${SIMENV_HEADLESS_MODE:-move_base}
      ENABLE_LIDAR: ${ENABLE_LIDAR:-false}
      CAMERA_IMAGER_RATE_HZ: ${CAMERA_IMAGER_RATE_HZ:-10}
      CAMERA_JPEG_QUALITY: ${CAMERA_JPEG_QUALITY:-92}
      START_ROSBRIDGE: ${START_ROSBRIDGE:-1}
      START_ODOM_RELAY: ${START_ODOM_RELAY:-1}
      START_BUILDING_CONTROL: ${START_BUILDING_CONTROL:-1}
      START_VIRTUAL_JOY: ${START_VIRTUAL_JOY:-0}
      CONTROLLER_FOREGROUND: ${CONTROLLER_FOREGROUND:-0}
      UNITREE_CTRL_DT: ${UNITREE_CTRL_DT:-0.002}
    command: >
      bash -lc "
        test -x ./auto.sh ||
          { echo 'ERROR: missing executable ./auto.sh'; exit 1; }
        exec ./auto.sh
      "
    # 健康检查只报告状态，不重启或切换控制器。它能识别 junior_ctrl 进程仍在但
    # /cmd_vel 订阅丢失的退化状态，平台组据此在独占时段处理，其他组不得自行重启。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/noetic/setup.bash &&
          { [ "$${START_CONTROLLER:-1}" != "1" ] ||
          { pgrep -x junior_ctrl >/dev/null &&
          rostopic info /cmd_vel 2>/dev/null |
          grep -Eq "^[[:space:]]*\*[[:space:]]+/unitree_gazebo_servo[[:space:]]"; }; } &&
          { [ "$${START_ROSBRIDGE:-1}" != "1" ] ||
          rosnode ping -c 1 /rosbridge_websocket >/dev/null 2>&1; }'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
