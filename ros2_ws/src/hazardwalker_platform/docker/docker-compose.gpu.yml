# GPU passthrough overlay — used when NVIDIA Container Toolkit is available.
# auto_noetic.sh adds: -f docker-compose.gpu.yml
services:
  simenv_noetic:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
