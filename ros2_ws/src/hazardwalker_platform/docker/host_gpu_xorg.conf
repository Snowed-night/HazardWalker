# HazardWalker GPU GUI 专用 Xorg：为无物理显示器的 RTX A6000 提供 :102 显示。
Section "ServerLayout"
    Identifier "HazardWalkerGpuLayout"
    Screen 0 "HazardWalkerGpuScreen"
EndSection

Section "Device"
    Identifier "HazardWalkerNvidiaGpu"
    Driver "nvidia"
    VendorName "NVIDIA Corporation"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "UseDisplayDevice" "None"
EndSection

Section "Screen"
    Identifier "HazardWalkerGpuScreen"
    Device "HazardWalkerNvidiaGpu"
    DefaultDepth 24
    Option "AllowEmptyInitialConfiguration" "True"
    SubSection "Display"
        Depth 24
        Virtual 1280 720
    EndSubSection
EndSection
