gz_bridge:
  ros__parameters:
    topics:
      # ===================== Gazebo → ROS 传感器 =====================
      # RGB相机图像
      - ros_topic_name: "/hw/camera/image_raw"
        gz_topic_name: "/world/hazardwalker_world/model/simple_robot/link/camera_link/sensor/camera/image"
        ros_type_name: "sensor_msgs/msg/Image"
        gz_type_name: "gz.msgs.Image"
        direction: GZ_TO_ROS

      # LiDAR 点云
      - ros_topic_name: "/hw/lidar/points"
        gz_topic_name: "/world/hazardwalker_world/model/simple_robot/link/lidar_link/sensor/lidar/points"
        ros_type_name: "sensor_msgs/msg/PointCloud2"
        gz_type_name: "gz.msgs.PointCloudPacked"
        direction: GZ_TO_ROS

      # 2D激光扫描
      - ros_topic_name: "/hw/lidar/scan"
        gz_topic_name: "/world/hazardwalker_world/model/simple_robot/link/lidar_link/sensor/lidar/scan"
        ros_type_name: "sensor_msgs/msg/LaserScan"
        gz_type_name: "gz.msgs.LaserScan"
        direction: GZ_TO_ROS

      # 里程计
      - ros_topic_name: "/hw/odom"
        gz_topic_name: "/model/simple_robot/odometry"
        ros_type_name: "nav_msgs/msg/Odometry"
        gz_type_name: "gz.msgs.Odometry"
        direction: GZ_TO_ROS

      # TF变换
      - ros_topic_name: "/tf"
        gz_topic_name: "/model/simple_robot/tf"
        ros_type_name: "tf2_msgs/msg/TFMessage"
        gz_type_name: "gz.msgs.Pose_V"
        direction: GZ_TO_ROS

      # 关节状态
      - ros_topic_name: "/joint_states"
        gz_topic_name: "/world/hazardwalker_world/model/simple_robot/joint_state"
        ros_type_name: "sensor_msgs/msg/JointState"
        gz_type_name: "gz.msgs.Model"
        direction: GZ_TO_ROS

      # ===================== ROS → Gazebo 控制指令 =====================
      # 底盘速度指令
      - ros_topic_name: "/cmd_vel"
        gz_topic_name: "/model/simple_robot/cmd_vel"
        ros_type_name: "geometry_msgs/msg/Twist"
        gz_type_name: "gz.msgs.Twist"
        direction: ROS_TO_GZ

    # 全局桥接参数（取消注释按需开启）
    # subscriber_creation_interval_sec: 0.1
    # lazy: false