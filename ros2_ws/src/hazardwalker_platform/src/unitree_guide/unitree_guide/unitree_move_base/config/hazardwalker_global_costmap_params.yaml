# 负责人适配：高层 Frontier 发送 odom 目标，move_base 在滚动窗口内完成规划。
global_costmap:
  global_frame: odom
  robot_base_frame: base
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 50.0
  height: 50.0
  resolution: 0.10
  transform_tolerance: 0.5
  map_type: costmap
