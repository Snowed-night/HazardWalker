# 负责人适配：宇树 unitree_move_base 的公共代价地图参数。
# 默认仍用 Mid-360 投影；launch 可把同一 LaserScan 输入覆盖为官方 /scan。
obstacle_range: 3.0
raytrace_range: 4.0
footprint: [[0.42, 0.38], [0.42, -0.38], [-0.45, -0.38], [-0.45, 0.38]]
footprint_padding: 0.02
# 2.0m 主门完全打开后的有效门洞约 1.12m。动态 A1 足迹加 padding
# 约 0.80m。SLAM/ROS1横向存在数十厘米漂移，保守包络让贴墙路径本身
# 不可行；0.10m inflation 仍保留主门和房门通道。
inflation_radius: 0.10
cost_scaling_factor: 5.0
max_obstacle_height: 1.0
min_obstacle_height: 0.0
observation_sources: livox_scan
livox_scan:
  data_type: LaserScan
  topic: /livox/scan_projection
  sensor_frame: laser_scan
  marking: true
  clearing: true
  inf_is_valid: true
  expected_update_rate: 0.0
  observation_persistence: 0.0
