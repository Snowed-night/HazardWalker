# 感知参数配置。
# 这里放红球检测阈值、定位参数和跟踪参数。

perception:
  red_ball_detector:
    color_space: HSV
    # Red wraps around the hue boundary, so use two ranges.
    lower_red_1: [0, 80, 80]
    upper_red_1: [10, 255, 255]
    lower_red_2: [170, 80, 80]
    upper_red_2: [180, 255, 255]
    min_area_px: 80
    min_circularity: 0.60
    min_aspect_ratio: 0.45
    min_extent: 0.35
    max_extent: 0.92
    min_confidence: 0.5

  localization:
    use_point_cloud: true
    max_detection_range_m: 20.0
    # 官方标准红球半径；设为 0 可禁用球面深度到球心的几何补偿。
    sphere_radius_m: 0.15
    # 完整球形候选使用投影半径反推球心；贴边/遮挡候选自动回退深度补偿。
    use_sphere_projection_geometry: true
    # world PoseInfo 与相机桥接存在毫秒级滞后时，允许回退至最新 TF。
    allow_latest_tf_fallback: true
    roi_padding_px: 8
    min_points_in_roi: 5
    output_frame: start

  tracking:
    confirm_observation_count: 3
    # 正式确认要求至少两个离散视角，避免圆柱/圆盘单视角投影直接确认为红球。
    confirm_distinct_views: 2
    reject_after_missed_count: 10
    merge_distance_m: 0.5

  active_reobservation:
    # 宽松候选只触发换视角，不进入危险源确认轨迹。
    emit_partial_candidates: true
    partial_min_area_px: 30
    partial_min_circularity: 0.30
    partial_min_aspect_ratio: 0.30
    partial_min_value: 50
