# 多 SEED 回放候选参数快照。
# 仅把确认所需球面深度视角从 2 个提高到 3 个，用于量化虚警与确认耗时的权衡。

perception:
  red_ball_detector:
    color_space: HSV
    # Red wraps around the hue boundary, so use two ranges.
    lower_red_1: [0, 80, 80]
    upper_red_1: [10, 255, 255]
    lower_red_2: [170, 80, 80]
    upper_red_2: [180, 255, 255]
    # 严格正证据至少 200 px；更小红色弧段交由 partial/reobserve 流程，
    # 不能与远处红色杂物一起直接累加为危险源。
    min_area_px: 200
    # 0.65 可排除 7 月 5 日复杂多球图中的红方块轮廓（0.644），同时保留
    # 45% 可见球的严格边界（约 0.66）。
    min_circularity: 0.65
    min_aspect_ratio: 0.45
    min_extent: 0.35
    # 圆形投影理论值约 0.785；超过 0.82 的近矩形区域只允许作为重观察候选。
    max_extent: 0.82
    min_confidence: 0.5

  localization:
    # 当前节点使用与 RGB 同步的深度图 ROI；点云后端尚未接入，禁止在配置中
    # 把路线计划写成已启用能力。
    use_point_cloud: false
    max_detection_range_m: 20.0
    # 球面必须同时具有横向和纵向凸曲率；单轴曲面（圆柱侧面、弧形板）只复查。
    min_sphere_depth_curvature_m: 0.008
    min_sphere_depth_shape_points: 8
    # 小于 40 px 的远球四方向深度曲率在官方 640×480 图像中不稳定，只靠近复查。
    min_sphere_depth_shape_bbox_px: 40
    min_sphere_axis_depth_points: 4
    min_sphere_axis_curvature_ratio: 0.35
    # 官方标准红球半径；设为 0 可禁用球面深度到球心的几何补偿。
    sphere_radius_m: 0.15
    # 官方当前桥接链 RGB-D 实测固定相差约 0.05 s；运行记录必须保存解析后的值。
    max_rgb_depth_sync_delta_sec: 0.06
    # 完整球形候选使用投影半径反推球心；贴边/遮挡候选自动回退深度补偿。
    use_sphere_projection_geometry: true
    # world PoseInfo 与相机桥接存在毫秒级滞后时，允许回退至最新 TF。
    allow_latest_tf_fallback: true
    roi_padding_px: 8
    min_points_in_roi: 5
    output_frame: map

  tracking:
    confirm_observation_count: 3
    # 正式确认要求三个稳定停靠视角，避免正面+靠近被误算成充分侧视证据。
    confirm_distinct_views: 3
    # 三个停靠点还必须让“相机 -> 目标”的水平视线至少跨越 25°。
    # 只从正面前后靠近无法排除圆柱、圆锥或圆盘端面。
    min_view_bearing_span_deg: 25.0
    # 备用路径只接受两个独立视角均为球面深度、直径约 0.30 m、曲率与轮廓
    # 一致且没有非球面反证的目标；纯 RGB 仍必须满足上面的 3 视角/25°。
    strong_depth_min_distinct_views: 2
    strong_depth_min_view_bearing_span_deg: 5.0
    reject_after_missed_count: 300
    # 正式链按仿真时间判丢失；重复帧和运行帧率变化不会提前耗尽轨迹寿命。
    # 官方 A1 在低实时倍率下完成一次侧移、回转和重新对准可能超过 20 秒仿真时间。
    # 60 秒仅保留“待复查”轨迹；被深度几何明确判为非球体的目标仍立即拒绝。
    reject_after_missed_sec: 60.0
    merge_distance_m: 0.5
    single_track_reacquire_distance_m: 1.0
    single_track_reacquire_diameter_relative_error: 0.25
    same_frame_duplicate_distance_m: 0.12
    same_frame_duplicate_diameter_relative_error: 0.25
    max_apparent_diameter_cv: 0.35
    # 官方目标直径 0.30 m；保持一定裕量以覆盖 RGB-D 投影/深度噪声。
    expected_sphere_diameter_m: 0.30
    max_sphere_diameter_relative_error: 0.35
    # 至少一个侧视轮廓低于该比例即保留为待复查，不能用正面帧中位数掩盖。
    min_multiview_aspect_ratio: 0.82
    # 只有至少两个独立视角产生 RGB-D 球面正证据，轨迹才允许 confirmed。
    min_spherical_views_for_confirm: 3
    max_depth_curvature_cv: 0.65
    # 球体深度曲率/表观直径的三视角中位数有效区间。
    min_normalized_depth_curvature: 0.10
    max_median_normalized_depth_curvature: 0.30

  active_reobservation:
    # 宽松候选只触发换视角，不进入危险源确认轨迹。
    emit_partial_candidates: true
    # 保留约 5% 可见球面的最小红色弧段；输出仅为 reobserve，不可直接确认。
    partial_min_area_px: 20
    partial_min_circularity: 0.18
    partial_min_aspect_ratio: 0.12
    partial_min_value: 50
    stable_view_min_frames: 3
    # 先由控制仲裁后的 /hw/cmd_vel 明确证明停止，再用以下阈值吸收 A1
    # 站立控制与合法 SLAM 的小幅抖动；命令缺失或过期时禁止累计确认视角。
    stable_view_cmd_vel_topic: /hw/cmd_vel
    stable_view_max_cmd_age_sec: 0.5
    stable_view_max_linear_speed_mps: 0.03
    stable_view_max_angular_speed_rps: 0.05
    stable_view_max_translation_m: 0.02
    stable_view_max_yaw_deg: 1.0
    # 已建立轨迹在短时机动离开视场后继续参与图像投影关联。
    track_projection_max_age_s: 180.0
    # 以下键对应 hsv_detector_node 的 active_view_* ROS 参数。
    edge_margin_ratio: 0.05
    # 约 40×40 px 后再做球面判形；更小候选先靠近，避免远球深度量化误杀。
    min_bbox_area_px: 1600
    min_red_pixel_count: 300
    min_circularity: 0.72
    min_confidence: 0.70
    far_distance_m: 5.0
    dense_iou_threshold: 0.15
    min_normalized_depth_curvature: 0.10
    max_normalized_depth_curvature: 0.30
    # 覆盖一次横移、停稳与重新对准；按仿真时间计，避免短暂出画更换候选 ID。
    candidate_memory_ttl_s: 60.0
    # 同一候选的侧移方向短时保持，避免目标跨过画面中心后左右振荡。
    active_view_direction_memory_ttl_s: 12.0
    candidate_memory_min_iou: 0.05
    candidate_memory_max_center_shift_ratio: 1.5
